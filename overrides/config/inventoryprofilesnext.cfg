# Configuration file

##########################################################################################################
# autorefill
#--------------------------------------------------------------------------------------------------------#
# Auto-refill settings
##########################################################################################################

autorefill {
    # Durability threshold for auto-refill (break tool when below this) [range: 0 ~ 100, default: 5]
    I:autoRefillDamageThreshold=5

    # Enable auto-refill of item stacks [default: true]
    B:enableAutoRefill=true
}


##########################################################################################################
# crafting
#--------------------------------------------------------------------------------------------------------#
# Continuous crafting settings
##########################################################################################################

crafting {
    # Auto-refill crafting grid ingredients from player inventory [default: true]
    B:enableContinuousCrafting=true
}


##########################################################################################################
# gui
#--------------------------------------------------------------------------------------------------------#
# GUI settings
##########################################################################################################

gui {
    # If Quark is installed, automatically lift the top chest sort buttons above the GUI so they don't overlap Quark's search bar. Disable to position them yourself with the offset options. [default: true]
    B:autoAdjustForQuark=true

    # Size of sort buttons in pixels [range: 5 ~ 20, default: 10]
    I:buttonSize=10

    # Play a sound when sorting [default: true]
    B:playSortSound=true

    # Show move-all buttons in container GUIs [default: true]
    B:showMoveAllButtons=true

    # Horizontal pixel offset for sort/move buttons (move right with +, left with -). Use to dodge other mods' overlays like Quark's search bar. [range: -200 ~ 200, default: 0]
    I:sortButtonOffsetX=0

    # Vertical pixel offset for sort/move buttons (down with +, up with -). [range: -200 ~ 200, default: 0]
    I:sortButtonOffsetY=0
}


##########################################################################################################
# lockedslots
#--------------------------------------------------------------------------------------------------------#
# Locked slots settings
##########################################################################################################

lockedslots {
    # Enable slot locking [default: true]
    B:enableLockedSlots=true
}


##########################################################################################################
# profiles
#--------------------------------------------------------------------------------------------------------#
# Inventory profile settings
##########################################################################################################

profiles {
    # Enable inventory profiles (save/load gear sets) [default: true]
    B:enableProfiles=true
}


##########################################################################################################
# sorting
#--------------------------------------------------------------------------------------------------------#
# Inventory sorting settings
##########################################################################################################

sorting {
    # Default sort method: 'id', 'name', or 'mod' [default: id]
    S:defaultSortMethod=id

    # Enable inventory sorting [default: true]
    B:enableSorting=true

    # Restock partial hotbar stacks from main inventory after sorting [default: true]
    B:restockHotbar=true

    # Show sort buttons in container GUIs [default: true]
    B:showSortButtons=true
}


