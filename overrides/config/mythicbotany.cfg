# Configuration file

client {
    # Scale of the item icons and spacing in the rune area of the rune ritual JEI recipe. [range: 0.1 ~ 2.0, default: 0.75]
    S:ritualJeiRuneScale=0.75
}


general {
    # Whether an Alfsteel Sword mana pulse inherits the sword's attack and enchantment attributes. [default: false]
    B:alfsteelSwordPulseInheritsWeaponAttributes=false

    # Chance for an Alfsteel Template to drop, from 0.0 to 1.0. [range: 0.0 ~ 1.0, default: 0.15]
    S:alfsteelTemplateDropChance=0.15

    # Entity registry names that can drop an Alfsteel Template when killed with an Alfsteel Sword. [default: [minecraft:witch], [minecraft:vindication_illager], [minecraft:evocation_illager]]
    S:alfsteelTemplateDropEntities <
        minecraft:witch
        minecraft:vindication_illager
        minecraft:evocation_illager
     >

    # Whether the Fimbultyr Tablet can teleport players between the Overworld and Alfheim. [default: false]
    B:allowFimbultyrTabletAlfheimTravel=false

    # Whether Hellebore prevents Nether Backport Piglins and Hoglins in its range from zombifying. [default: true]
    B:enableUnseensNetherBackportIntegration=true

    # Whether Hellebore heals and begins curing zombie villagers in its range. [default: true]
    B:helleboreHealsZombieVillagers=true

    # Whether a dropped Mjoellnir becomes a placed block when it lands on the ground. [default: true]
    B:mjoellnirDropsBecomeBlocks=true

    # Maximum distance in blocks that Mjoellnir can fly before returning. This value cannot be zero. [range: 0.01 ~ 100000.0, default: 64.0]
    S:mjoellnirFlightDistance=64.0

    # Mjoellnir's outward flight speed. This value cannot be zero. [range: 0.01 ~ 100.0, default: 1.5]
    S:mjoellnirFlightSpeed=1.5

    # Cooldown in ticks after launching Mjoellnir; zero disables it. [range: 0 ~ 2147483647, default: 20]
    I:mjoellnirLaunchCooldown=20

    # Damage dealt by the lightning projectile created by Mjoellnir. [range: 0.0 ~ 3.4028235E38, default: 5.0]
    S:mjoellnirLightningDamage=5.0

    # Whether lifting or picking up Mjoellnir requires the player to have eaten a golden apple. [default: true]
    B:mjoellnirRequiresGoldenApple=true
}


